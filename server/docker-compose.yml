services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialstory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/socialstory?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-insecure-change-me
      SMS_DEV_MODE: "true"
      SMS_DEV_CODE: "1234"
      MONTHLY_FREE_QUOTA: "3"
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8080:8080"

volumes:
  pgdata:
